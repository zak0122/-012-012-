# List of journals to monitor via PubMed (NCBI E-utilities).
# "issn" should be the print or electronic ISSN as indexed by PubMed.
# You can verify/correct ISSNs at https://www.ncbi.nlm.nih.gov/nlmcatalog
# by searching the journal title.
#
# "rss" is optional -- add a journal's own ahead-of-print/current-issue
# RSS feed URL to catch articles before PubMed indexes them (see
# src/rss_watch.py). Most journal sites have a "RSS" link in the site
# footer or under "For Readers"/"Alerts" -- verify each one works before
# relying on it, feeds move and break. Left blank below where I haven't
# verified a live URL; PubMed indexing still covers those journals via
# monitor.py, just with more lag.

journals:
  # --- Top tier general IM/medicine ---
  - name: "New England Journal of Medicine"
    issn: "1533-4406"
    rss: "https://www.nejm.org/action/showFeed?jc=nejm&type=etoc&feed=rss"  # includes ahead-of-print
  - name: "The Lancet"
    issn: "1474-547X"
  - name: "JAMA"
    issn: "1538-3598"
  - name: "Annals of Internal Medicine"
    issn: "1539-3704"
  - name: "BMJ"
    issn: "1756-1833"
    rss: "https://www.bmj.com/rss/current.xml"

